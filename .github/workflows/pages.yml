# Déploiement automatique sur GitHub Pages à chaque push sur la branche de travail
# (branche par défaut du dépôt) ou sur « main », et à la demande (Run workflow).
# L'environnement « github-pages » n'autorise que la branche par défaut : si « main »
# devient la branche par défaut (Settings → Branches), les pushs sur « main » déploieront.
# Le workflow tente d'activer Pages lui-même (enablement) ; à défaut : Settings → Pages → Source : « GitHub Actions ».
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/wizardly-gates-91bh18, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Active GitHub Pages (source « GitHub Actions ») au premier déploiement si ce n'est pas déjà fait.
          enablement: true
      - name: Empreinte de version (anti-cache)
        # Les URL des feuilles de style et scripts reçoivent ?v=<commit> et la balise
        # <meta name="mz-build"> reçoit le commit : chaque déploiement force le navigateur
        # à recharger les assets (GitHub Pages les met en cache 10 min) et diag.html
        # peut afficher la version réellement servie.
        run: |
          v="${GITHUB_SHA::8}"
          for f in *.html; do
            sed -i -E "s#(assets/(css|js)/[A-Za-z0-9_.-]+\.(css|js))\"#\1?v=${v}\"#g; s#<meta name=\"mz-build\" content=\"dev\">#<meta name=\"mz-build\" content=\"${v}\">#" "$f"
          done
          grep -c "?v=${v}" index.html transport.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
