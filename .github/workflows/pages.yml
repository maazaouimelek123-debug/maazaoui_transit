# Hébergement secondaire (GitHub Pages), lancé uniquement à la demande : Actions → Deploy to
# GitHub Pages → Run workflow. L'hébergement principal est Netlify (netlify.toml), qui publie
# automatiquement à chaque push sur la branche de production choisie dans Netlify.
# Pour que ce workflow aboutisse : Settings → Pages → Source : « GitHub Actions » (dépôt public).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparation du site (version, adresse publique)
        env:
          SITE_URL: https://maazaouimelek123-debug.github.io/maazaoui_transit
        run: bash scripts/build.sh dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
