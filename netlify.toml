# Netlify — site statique, aucune compilation.
# Le script copie le site dans dist/ et y inscrit la version (?v=<commit>) et l'adresse
# publique (URL fournie par Netlify : domaine personnalisé s'il y en a un).
[build]
  command = "bash scripts/build.sh dist"
  publish = "dist"

# Pas de réécriture des fichiers par Netlify (liens .html conservés, sitemap cohérent).
[build.processing]
  skip_processing = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Feuilles de style et scripts : toujours référencés avec ?v=<commit>, donc cache long sans risque.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
